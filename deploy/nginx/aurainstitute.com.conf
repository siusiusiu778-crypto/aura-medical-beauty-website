# aurainstitute.com（AURA Institute 正式域名，2026-11-19 上线）。脱敏记录，<> 为占位。
# 服务器上的位置：<nginx 目录>/sites.d/aurainstitute.com.conf（一个域名一个文件，和其他站点一样被 http 级自动 include）。
# 证书：certbot webroot（<验证目录>/.well-known/acme-challenge），裸域与 www 同一张证书，续期走机器上已有的每日计划任务与全局重载钩子。

# 80：证书验证 + 跳转到 https 裸域（www 与裸域都跳到 https://aurainstitute.com）
server {
    listen 80;
    server_name aurainstitute.com www.aurainstitute.com;
    location ^~ /.well-known/acme-challenge/ {
        root <验证目录>;
        default_type "text/plain";
        allow all;
    }
    location / {
        return 301 https://aurainstitute.com$request_uri;
    }
}

# 443：www 一律跳转到裸域
server {
    listen 443 ssl;
    server_name www.aurainstitute.com;
    ssl_certificate     /etc/letsencrypt/live/aurainstitute.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aurainstitute.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://aurainstitute.com$request_uri;
}

# 443：裸域，应用在根路径
server {
    listen 443 ssl;
    server_name aurainstitute.com;
    ssl_certificate     /etc/letsencrypt/live/aurainstitute.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aurainstitute.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # 共享内存区名必须独一无二：同一台机器上其他站点已经声明了名为 SSL 的区，大小不同会导致 nginx -t 失败
    ssl_session_cache shared:SSL_AURA:2m;
    ssl_session_timeout 5m;
    add_header Strict-Transport-Security "max-age=15552000" always;

    access_log /var/log/nginx/aurainstitute.access.log;
    error_log  /var/log/nginx/aurainstitute.error.log;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain application/xml text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # 线索表单：只放行 POST /api/leads（同源，浏览器直接提交）
    location = /api/leads {
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://<Vectra 内网地址>:9924/portal_backend_v2/api/aura/public/leads;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host <Vectra 后端主机名>;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 1m;
        proxy_redirect off;
    }

    # 公开只读接口：只放行 GET/HEAD；管理接口不在这个前缀下，不对外
    location ^~ /api/ {
        limit_except GET { deny all; }
        proxy_pass http://<Vectra 内网地址>:9924/portal_backend_v2/api/aura/public/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host <Vectra 后端主机名>;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 1m;
        proxy_redirect off;
    }

    # 应用本体（含 /_deploy/status.json、/_site/*）：转发到本机容器；proxy_pass 不带 URI，原样传递路径
    location / {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
