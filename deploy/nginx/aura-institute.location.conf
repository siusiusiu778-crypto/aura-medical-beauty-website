# AURA Institute 测试环境：挂在已有站点 <原域名> 的子目录 /aura-institute/ 下（脱敏记录，<> 为占位）。
# 服务器上的位置：<nginx 目录>/aura/aura-institute.location.conf，只被原站点 443 server 块 include 一次。
# 不能放进 sites.d/：那里的文件会被 http 级自动 include，location 不能出现在 http 级。
#
# 为什么都用 ^~：原站点（WordPress）有一批正则 location，正则优先于普通前缀；^~ 前缀命中后不再匹配正则。
# 服务器级 rewrite（会把不存在的路径改写到 WordPress）由原站点文件里的放行行挡住，见 overseasstudent.com.patch.md。

# ① 拼写兜底：aura-institude（常见笔误）与无斜杠，一律 301 到主路径
location = /aura-institute {
        return 301 https://$host/aura-institute/;
}
location = /aura-institude {
        return 301 https://$host/aura-institute/;
}
location ^~ /aura-institude/ {
        rewrite ^/aura-institude/(.*)$ /aura-institute/$1 permanent;
}

# ② 线索表单：只放行 POST /aura-institute/api/leads（同源，浏览器直接提交）
location = /aura-institute/api/leads {
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://<Vectra 内网地址>:9924/portal_backend_v2/api/aura/public/leads;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host <Vectra 后端主机名>;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 1m;
        proxy_redirect off;
        add_header X-Robots-Tag "noindex, nofollow" always;
}

# ③ 公开只读接口：只放行 GET/HEAD，管理接口不在这个前缀下，不对外
location ^~ /aura-institute/api/ {
        limit_except GET { deny all; }
        proxy_pass http://<Vectra 内网地址>:9924/portal_backend_v2/api/aura/public/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host <Vectra 后端主机名>;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 1m;
        proxy_redirect off;
        add_header X-Robots-Tag "noindex, nofollow" always;
}

# ④ 应用本体（含 /aura-institute/_deploy/status.json、/aura-institute/_site/*）：转发到本机容器。
# proxy_pass 不带 URI，原样传递请求路径，由应用的 baseURL 处理前缀。
location ^~ /aura-institute/ {
        proxy_pass http://127.0.0.1:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # 子目录阶段全站禁止收录（响应头与应用里的 meta 双保险）；原站点根目录的 robots.txt 不动
        add_header X-Robots-Tag "noindex, nofollow" always;
        gzip on;
        gzip_proxied any;
        gzip_types text/plain application/xml text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1000;
}
